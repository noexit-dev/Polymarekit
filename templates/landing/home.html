{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello, world!</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  </head>
  <body class="min-h-screen bg-slate-950 text-white">
    <main id="welcome" class="flex min-h-screen items-center justify-center px-6 py-16">
      <section class="max-w-3xl text-center">
        <p class="mb-6 text-sm font-semibold uppercase tracking-[0.35em] text-cyan-300">
          Django · Tailwind · SQLite
        </p>
        <h1 class="text-5xl font-bold tracking-tight sm:text-7xl">
          Hello, world!
        </h1>
        <p class="mx-auto mt-6 max-w-xl text-lg leading-8 text-slate-300">
          A simple starting point for something great.
        </p>
        <a
          class="mt-10 inline-flex rounded-full bg-cyan-400 px-6 py-3 font-semibold text-slate-950 transition hover:bg-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-300 focus:ring-offset-2 focus:ring-offset-slate-950"

          Get started
        </a>
